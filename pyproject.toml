[project]
name = "geolab"
version = "0.1.0"
description = "Tool for geodetic calculations"
readme = "README.md"
authors = [
    { name = "Oguzb", email = "hoguzbolat@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
geolab = "geolab.tui:main"

[project.optional-dependencies]
tui = [
    "textual>=8.2.8",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "textual-dev>=1.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
